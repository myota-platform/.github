name: Shared Python quality checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff formatting and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff==0.16.10
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
